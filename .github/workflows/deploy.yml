name: Deploy GitHub Pages

on:
  push:
    # Filtro largo de propósito: quem decide de verdade é o `if` do job abaixo.
    # Aqui só evitamos criar execução para branch que nunca seria publicada.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Publica a branch PADRÃO do repositório, qualquer que ela seja — que é
    # exatamente o que a regra de proteção do ambiente `github-pages` permite.
    # Push em qualquer outra branch roda os testes e para antes de publicar.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
        env:
          # O Pages de projeto serve em /<nome-do-repo>/, e o app precisa saber
          # disso para achar os próprios arquivos e registrar o service worker.
          BASE_PATH: /${{ github.event.repository.name }}/
          # A anon key do Supabase é pública por design — quem protege os dados
          # é o RLS no banco. Fica em secrets apenas para não versionar a URL
          # do projeto no repositório.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Roda em qualquer branch: serve para saber que o trabalho está são antes de
  # virar branch padrão, já que o job de cima nem começa fora dela. Usa o mesmo
  # ambiente do build de verdade — um ensaio com outra configuração não ensaia nada.
  conferir:
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Diz se as chaves existem, nunca o que elas são. Publicar sem elas gera um
      # app que abre na tela de configuração em vez da tela de entrada — e é bom
      # descobrir isso aqui, não no celular.
      - name: Conferir se as chaves do banco estão cadastradas
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          CHAVE: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          faltando=""
          if [ -z "$URL" ]; then faltando="$faltando VITE_SUPABASE_URL"; fi
          if [ -z "$CHAVE" ]; then faltando="$faltando VITE_SUPABASE_ANON_KEY"; fi
          if [ -n "$faltando" ]; then
            echo "::warning::Faltam secrets:$faltando — publicado assim, o app abre na tela de configuração."
          else
            echo "As duas chaves do Supabase estão cadastradas neste repositório."
            echo "Publicar leva o app direto para a tela de entrada."
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
