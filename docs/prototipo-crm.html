<title>Kanoe CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EEF0F3;--paper:#FBFBFC;--panel:#F4F6F8;--sunk:#E7EAEF;
  --ink:#14171F;--ink-2:#454D5C;--ink-3:#727B8B;
  --rule:#D4D9E1;--rule-soft:#E4E8EE;
  --ai:#223A5E;--ai-2:#3A5B94;--ai-soft:#E5EAF3;
  --urushi:#A8322D;--urushi-bg:#F8E9E7;
  --amber:#8A5A18;--amber-bg:#F8EFDF;
  --matcha:#2F6B4F;--matcha-bg:#E5EFE9;
  --on-ai:#FBFBFC;
  --sans:"Zen Kaku Gothic New",-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Zen Old Mincho",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sh:0 1px 2px rgba(20,23,31,.06),0 8px 24px -18px rgba(20,23,31,.3);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1016;--paper:#151922;--panel:#1A1F29;--sunk:#20262F;
  --ink:#E8EBF1;--ink-2:#AEB7C5;--ink-3:#7B8595;
  --rule:#2C333F;--rule-soft:#232932;
  --ai:#8FB0E4;--ai-2:#A9C5F1;--ai-soft:#1B2434;
  --urushi:#E98882;--urushi-bg:#2E1B1A;
  --amber:#DCAD66;--amber-bg:#2B2317;
  --matcha:#82C3A3;--matcha-bg:#152520;
  --on-ai:#0D1016;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -20px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0D1016;--paper:#151922;--panel:#1A1F29;--sunk:#20262F;
  --ink:#E8EBF1;--ink-2:#AEB7C5;--ink-3:#7B8595;
  --rule:#2C333F;--rule-soft:#232932;
  --ai:#8FB0E4;--ai-2:#A9C5F1;--ai-soft:#1B2434;
  --urushi:#E98882;--urushi-bg:#2E1B1A;
  --amber:#DCAD66;--amber-bg:#2B2317;
  --matcha:#82C3A3;--matcha-bg:#152520;
  --on-ai:#0D1016;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai-2);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* Shell de altura fixa: o conteúdo rola dentro de <main>, e a barra é um
   irmão que nunca sai da tela. `position:fixed` não serve aqui — dentro do
   frame do artifact ele se ancora na altura do documento, não na da janela,
   e a barra ia parar no fim de tudo. */
#shell{height:100%;min-height:420px;display:flex;flex-direction:column}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
@media (min-width:900px){#app{display:grid;grid-template-columns:216px minmax(0,1fr)}}
.side{display:none}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:2px;padding:22px 14px;border-right:1px solid var(--rule);
        background:var(--paper);height:100%;overflow-y:auto}
}
.brand{font-family:var(--serif);font-weight:700;font-size:1.22rem;letter-spacing:-.01em;padding:0 10px 4px}
.brand small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:400;margin-top:3px}
.side nav{display:flex;flex-direction:column;gap:1px;margin-top:20px}
.side nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:5px;text-decoration:none;color:var(--ink-2);font-size:.92rem;font-weight:500}
.side nav a:hover{background:var(--panel)}
.side nav a.on{background:var(--ai);color:var(--on-ai);font-weight:700}
.side nav a .g{width:17px;text-align:center;flex:none;font-size:14px}
.tabbar{flex:none;display:flex;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:900px){.tabbar{display:none}}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;text-decoration:none;color:var(--ink-3);font-size:10.5px;font-weight:600}
.tabbar a.on{color:var(--ai)}
.tabbar a .g{font-size:17px;line-height:1}
main{min-width:0;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:20px 16px 32px;max-width:940px;margin:0 auto}
@media (min-width:900px){.pad{padding:30px 34px 48px}}

/* bits */
h1.t{font-family:var(--serif);font-weight:700;font-size:1.7rem;line-height:1.2;margin:0 0 3px;letter-spacing:-.01em}
.lede{color:var(--ink-3);font-size:.88rem;margin:0 0 22px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:26px 0 10px}
.eyebrow:first-child{margin-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--ai);color:var(--on-ai);border:0;border-radius:6px;padding:0 15px;min-height:42px;font-weight:700;font-size:.9rem;cursor:pointer}
.btn:hover{background:var(--ai-2)}
.btn.gh{background:transparent;color:var(--ink-2);border:1px solid var(--rule)}
.btn.gh:hover{background:var(--panel);color:var(--ink)}
.btn.sm{min-height:34px;padding:0 11px;font-size:.83rem;border-radius:5px}
.btn.dang{background:transparent;color:var(--urushi);border:1px solid var(--rule)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.empty{background:var(--panel);border:1px dashed var(--rule);border-radius:8px;padding:26px 20px;text-align:center;color:var(--ink-3);font-size:.9rem}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=email],select,textarea{
  width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:9px 11px;min-height:42px}
textarea{min-height:78px;resize:vertical;line-height:1.55}
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:5px}
.grid2{display:grid;gap:0 14px}
@media (min-width:620px){.grid2{grid-template-columns:1fr 1fr}}

/* cartão de reserva */
.rescard{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--rule);
  border-radius:9px;padding:13px 15px;cursor:pointer;box-shadow:var(--sh);margin-bottom:9px}
.rescard:hover{border-color:var(--ai-2);border-left-color:var(--ai-2)}
.rescard.risk{border-left-color:var(--urushi)}
.rescard .l1{display:flex;justify-content:space-between;gap:10px;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-bottom:6px}
.rescard .l1 b{color:var(--ink);font-size:14px;font-weight:600}
.rescard .nm{font-family:var(--serif);font-weight:700;font-size:1.16rem;line-height:1.25;margin:0}
.rescard .ex{font-size:.85rem;color:var(--ink-2);margin:1px 0 0}
.pill{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:4px;border:1px solid currentColor;flex:none;white-space:nowrap}
.pill.new{color:var(--ai)}
.pill.wait{color:var(--amber)}
.alert{display:flex;gap:8px;align-items:center;background:var(--urushi-bg);color:var(--urushi);font-weight:700;font-size:.85rem;padding:8px 11px;border-radius:6px;margin-top:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.79rem;padding:3px 9px;border-radius:20px;background:var(--panel);border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.chip.risk{background:var(--urushi-bg);border-color:transparent;color:var(--urushi);font-weight:700}
.chip.occ{background:var(--amber-bg);border-color:transparent;color:var(--amber);font-weight:600}
.chip.go{background:var(--ai-soft);border-color:transparent;color:var(--ai);font-weight:600}

/* list rows */
.rows{display:flex;flex-direction:column;background:var(--rule);border:1px solid var(--rule);border-radius:9px;overflow:hidden;gap:1px}
.rowitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;background:var(--paper);border:0;text-align:left;padding:13px 15px;cursor:pointer;width:100%}
.rowitem:hover{background:var(--panel)}
.rowitem .n{font-weight:700;font-size:1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowitem .m{font-size:.8rem;color:var(--ink-3);grid-column:1;font-family:var(--mono)}
.rowitem .r{grid-row:1/3;align-self:center;text-align:right;font-family:var(--mono);font-size:.78rem;color:var(--ink-3);line-height:1.5}
.rowitem .r b{display:block;color:var(--ink);font-size:.95rem}

/* ficha blocks */
.blk{background:var(--paper);border:1px solid var(--rule);border-radius:9px;margin-bottom:10px;overflow:hidden}
.blk > h3{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0;padding:12px 15px;
  font-size:.83rem;font-family:var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  border-bottom:1px solid var(--rule-soft)}
.blk.crit{border-color:var(--urushi)}
.blk.crit > h3{background:var(--urushi-bg);color:var(--urushi);border-bottom-color:transparent}
.blk .body{padding:13px 15px}
.fields{display:grid;gap:0}
.fld{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--rule-soft)}
.fld:last-child{border-bottom:0}
.fld > .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding-top:5px}
.fld > .v{min-width:0}
@media (max-width:560px){.fld{grid-template-columns:1fr;gap:2px}.fld > .k{padding-top:0}}
.edit{background:transparent;border:1px dashed transparent;border-radius:5px;padding:3px 6px;margin:-3px -6px;
  text-align:left;cursor:pointer;color:inherit;font:inherit;width:100%;min-height:30px}
.edit:hover{border-color:var(--rule);background:var(--panel)}
.edit.blank{color:var(--ink-3);font-style:italic;font-size:.88rem}
.tl{display:flex;flex-direction:column;gap:0}
.tl .ev{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule-soft);align-items:baseline}
.tl .ev:last-child{border-bottom:0}
.tl .d{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.tl .w{min-width:0}
.tl .w b{font-weight:700;font-size:.92rem}
.tl .w small{display:block;color:var(--ink-3);font-size:.79rem}
.tl .amt{font-family:var(--mono);font-size:.82rem;color:var(--ink-2);text-align:right;white-space:nowrap}
@media (max-width:560px){.tl .ev{grid-template-columns:70px minmax(0,1fr)}.tl .amt{grid-column:2;text-align:left;padding-top:2px}}

/* metrics */
.mets{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:9px;overflow:hidden;margin-bottom:16px}
@media (min-width:720px){.mets{grid-template-columns:repeat(4,1fr)}}
.met{background:var(--paper);padding:15px}
.met b{display:block;font-family:var(--serif);font-weight:700;font-size:1.65rem;line-height:1.05;letter-spacing:-.02em}
.met span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-top:6px;line-height:1.4}

/* barras (uma série, uma cor — sem legenda: o título nomeia a série) */
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:11px;align-items:center}
.barrow .yl{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.barrow .tr{height:16px;background:var(--sunk);border-radius:3px;overflow:hidden}
.barrow .fl{height:100%;background:var(--ai);border-radius:0 4px 4px 0;display:block;min-width:3px}
.barrow .vl{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.statusrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--rule-soft)}
.statusrow:last-child{border-bottom:0}
.statusrow .mk{width:20px;flex:none;text-align:center;font-size:12px}
.statusrow .lb{flex:1;font-size:.92rem}
.statusrow .ct{font-family:var(--mono);font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(12,15,21,.5);z-index:80;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--ground);width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;
  border-radius:14px 14px 0 0;overflow:hidden;box-shadow:0 -8px 40px rgba(0,0,0,.3)}
@media (min-width:640px){.sheet{border-radius:12px}}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 17px;border-bottom:1px solid var(--rule);background:var(--paper)}
.sheet header h4{margin:0;font-family:var(--serif);font-weight:700;font-size:1.1rem}
.sheet .sbody{overflow-y:auto;padding:15px 17px;flex:1}
.sheet footer{padding:13px 17px;border-top:1px solid var(--rule);background:var(--paper);display:flex;gap:9px;justify-content:flex-end}
.x{background:transparent;border:0;color:var(--ink-3);font-size:20px;line-height:1;cursor:pointer;padding:5px 8px;border-radius:5px}
.x:hover{background:var(--panel);color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.opt{display:flex;align-items:center;gap:11px;background:var(--paper);border:0;padding:11px 13px;cursor:pointer;text-align:left;width:100%;font-size:.93rem}
.opt:hover{background:var(--panel)}
.opt .bx{width:19px;height:19px;border:1.5px solid var(--rule);border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.opt.on .bx{background:var(--ai);border-color:var(--ai);color:var(--on-ai)}
.opt.on{font-weight:600}
.opt .off{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* banner */
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:8px;font-size:.85rem;margin-bottom:16px;line-height:1.5}
.banner.warn{background:var(--amber-bg);color:var(--amber)}
.banner.info{background:var(--ai-soft);color:var(--ai)}
.banner b{font-weight:700}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fbtn{background:var(--paper);border:1px solid var(--rule);border-radius:20px;padding:5px 12px;font-size:.82rem;cursor:pointer;color:var(--ink-2)}
.fbtn.on{background:var(--ai);border-color:var(--ai);color:var(--on-ai);font-weight:700}
.taxrow{display:flex;align-items:center;gap:10px;background:var(--paper);padding:9px 13px;border:0;width:100%;text-align:left;cursor:pointer}
.taxrow:hover{background:var(--panel)}
.taxrow.off{color:var(--ink-3);text-decoration:line-through}
.note{background:var(--panel);border:1px solid var(--rule-soft);border-radius:7px;padding:10px 13px;margin-bottom:8px}
.note p{margin:0 0 4px;font-size:.9rem}
.note .meta{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="shell">
  <div id="app">
    <aside class="side">
      <div class="brand">Kanoe<small>CRM de salão</small></div>
      <nav id="snav"></nav>
      <div style="margin-top:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);padding:0 10px;line-height:1.6" id="sfoot"></div>
    </aside>
    <main><div class="pad" id="view"></div></main>
  </div>
  <nav class="tabbar" id="tnav"></nav>
</div>
<div id="modal"></div>

<script>
"use strict";
const TABS=[["painel","Painel","◴"],["agenda","Agenda","▤"],["clientes","Clientes","☰"],["listas","Listas","⚙"]];
const S={db:null,dbState:"carregando",clientes:{},reservas:{},tax:{},notas:{},rota:location.hash.slice(2)||"painel",busca:"",filtros:[]};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>n==null?"—":n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const hoje=()=>new Date().toISOString().slice(0,10);
const dfmt=d=>{if(!d)return"—";const[a,m,g]=d.split("-");return g+"/"+m+"/"+a;};
const dcurto=d=>{if(!d)return"—";const[a,m,g]=d.split("-");return g+"/"+m+"/"+a.slice(2);};
const DIAS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const diaSem=d=>{try{return DIAS[new Date(d+"T12:00:00").getDay()]}catch(e){return""}};

/* ── data ─────────────────────────────────────────── */
async function conectar(){
  let db=null;
  try{ db = window.claude && claude.use ? await claude.use("db") : null; }catch(e){ db=null; }
  if(!db){ S.dbState="local"; pinta(); return; }
  S.db=db; S.dbState="ok";
  const liga=(col,alvo)=>db.collection(col).onSnapshot(
    snap=>{ const o={}; snap.docs.forEach(d=>{o[d.id]=Object.assign({id:d.id},d.data())}); S[alvo]=o; pinta(); },
    e=>{ S.dbState="erro:"+e.code; pinta(); });
  liga("clientes","clientes"); liga("reservas","reservas");
  liga("taxonomias","tax"); liga("notas","notas");
}
async function grava(col,id,dados,merge){
  const alvo=({clientes:"clientes",reservas:"reservas",taxonomias:"tax",notas:"notas"})[col];
  S[alvo][id]=Object.assign({},merge?S[alvo][id]:null,dados,{id:id});
  pinta();
  if(!S.db) return;
  // `set` sempre: o objeto local já está mesclado, e um set é idempotente —
  // não vale uma ida ao servidor só para decidir entre set e update.
  try{ await S.db.doc(col+"/"+id).set(semId(S[alvo][id])); }
  catch(e){ alerta("Não deu para salvar: "+(e&&e.message||e)); }
}
const semId=o=>{const c=Object.assign({},o); delete c.id; return c;};
async function apaga(col,id){
  const alvo=({clientes:"clientes",reservas:"reservas",notas:"notas"})[col];
  delete S[alvo][id]; pinta();
  if(S.db){ try{ await S.db.doc(col+"/"+id).delete() }catch(e){} }
}
function novoId(pref){
  const n=Object.keys(pref==="CLI"?S.clientes:S.reservas)
    .map(k=>parseInt(String(k).replace(/\D/g,""),10)).filter(n=>!isNaN(n));
  return pref+"-"+String((n.length?Math.max.apply(null,n):0)+1).padStart(5,"0");
}

/* ── helpers de domínio ───────────────────────────── */
const ops=t=>((S.tax[t]||{}).opcoes||[]).filter(o=>o.ativo).map(o=>o.valor);
const cliente=id=>S.clientes[id];
const resDe=id=>Object.values(S.reservas).filter(r=>r.cliente_id===id)
  .sort((a,b)=>String(b.data_reserva).localeCompare(String(a.data_reserva)));
function resumo(id){
  const rs=resDe(id), bruto=rs.reduce((s,r)=>s+(r.total_bruto||0),0);
  const datas=rs.map(r=>r.data_reserva).filter(Boolean).sort();
  return{visitas:rs.length,
    pessoas:rs.reduce((s,r)=>s+(r.total_pessoas||0),0),
    bruto:bruto,
    ticket:rs.length?bruto/rs.length:0,
    ultima:datas[datas.length-1]||null};
}
const temRisco=c=>c&&((c.alergias||[]).length>0||(c.restricoes||[]).length>0);

/* ── render ───────────────────────────────────────── */
const VIEWS={painel:vPainel,agenda:vAgenda,clientes:vClientes,listas:vListas};

/** A ficha fica sob /cliente/<id>, então a aba Clientes segue acesa nela. */
const abaAtiva=(aba,rota)=>rota===aba||(aba==="clientes"&&rota.startsWith("cliente/"));

function navHtml(rota){
  return TABS.map(([chave,rotulo,icone])=>
    `<a href="#/${chave}" class="${abaAtiva(chave,rota)?"on":""}"><span class="g" aria-hidden="true">${icone}</span>${rotulo}</a>`
  ).join("");
}

function pinta(){
  const rota=S.rota;
  $("#snav").innerHTML=$("#tnav").innerHTML=navHtml(rota);
  $("#sfoot").innerHTML=S.dbState==="ok"?"Salvando no banco":
    S.dbState==="local"?"<span style='color:var(--amber)'>Sem banco · só nesta aba</span>":esc(S.dbState);
  $("#view").innerHTML=rota.startsWith("cliente/")
    ? vFicha(rota.slice(8))
    : (VIEWS[rota]||vPainel)();
}
function bannerDb(){
  if(S.dbState==="local") return `<div class="banner warn"><b>Sem conexão com o banco.</b> Dá para navegar e testar, mas o que você digitar não fica salvo ao recarregar.</div>`;
  if(S.dbState.startsWith("erro")) return `<div class="banner warn"><b>O banco recusou a leitura</b> (${esc(S.dbState)}). Recarregue a página.</div>`;
  return "";
}

/* Agenda */
function vAgenda(){
  const todas=Object.values(S.reservas).sort((a,b)=>String(b.data_reserva).localeCompare(String(a.data_reserva)));
  const h=hoje();
  const dhoje=todas.filter(r=>r.data_reserva===h);
  const prox=todas.filter(r=>r.data_reserva>h).reverse();
  const ant=todas.filter(r=>r.data_reserva<h);
  const sec=(t,l,vazio)=>l.length?`<p class="eyebrow">${t} · ${l.length}</p>`+l.map(cardRes).join(""):
    (vazio?`<p class="eyebrow">${t}</p><p class="muted" style="font-size:.87rem;margin:-4px 0 4px">${vazio}</p>`:"");
  return bannerDb()+`
    <div class="spread"><div><h1 class="t">Agenda</h1>
      <p class="lede">${dfmt(h)} · ${diaSem(h)}</p></div>
      <button class="btn" onclick="formReserva()">+ Nova reserva</button></div>
    ${sec("Hoje",dhoje,"Nenhuma reserva para hoje. Crie uma para testar o fluxo do serviço.")}
    ${sec("Próximas",prox,"")}
    ${sec("Já realizadas",ant,"")}`;
}
function cardRes(r){
  const c=cliente(r.cliente_id), risco=temRisco(c);
  const tags=[];
  if(c&&c.traz_proprias_bebidas) tags.push(`<span class="chip">Traz as próprias bebidas</span>`);
  if(c&&c.preferencia_agua) tags.push(`<span class="chip">Água ${esc(c.preferencia_agua)}</span>`);
  if(c&&c.mao_dominante==="Canhoto") tags.push(`<span class="chip">Canhoto · hashi à esquerda</span>`);
  if(c&&c.hashi_personalizado) tags.push(`<span class="chip">Hashi personalizado</span>`);
  (r.ocasioes||[]).forEach(o=>tags.push(`<span class="chip occ">${esc(o)}</span>`));
  const alerta=risco?`<div class="alert"><span>▲</span><span>${
    (c.alergias||[]).length?"ALERGIA · "+esc((c.alergias||[]).join(", ")):""}${
    (c.alergias||[]).length&&(c.restricoes||[]).length?" · ":""}${
    (c.restricoes||[]).length?"RESTRIÇÃO · "+esc((c.restricoes||[]).join(", ")):""}</span></div>`:"";
  const fin=r.status_financeiro==="Aguardando faturamento"?`<span class="pill wait">a faturar</span>`:"";
  return `<button class="rescard ${risco?"risk":""}" onclick="irCliente('${esc(r.cliente_id)}')">
    <div class="l1"><span><b>${esc(r.horario||"--:--")}</b> · ${esc(dcurto(r.data_reserva))} · ${esc(r.tipo_mesa||"—")} · ${r.total_pessoas||"?"} ${r.total_pessoas===1?"pessoa":"pessoas"}</span>
    <span class="row" style="gap:5px">${fin}${r.primeira_visita?'<span class="pill new">1ª vez</span>':""}</span></div>
    <p class="nm">${esc(c?c.nome:r.cliente_id)}</p>
    <p class="ex">${c&&c.apelido?"“"+esc(c.apelido)+"” · ":""}${esc(r.experiencia||"Experiência não registrada")}</p>
    ${alerta}${tags.length?`<div class="chips" style="margin-top:9px">${tags.join("")}</div>`:""}
  </button>`;
}

/* Clientes */
const FILTROS=[["risco","Com alergia ou restrição",temRisco],
               ["top","No ranking",c=>!!c.ranking],
               ["sumido","Sem vir há 6 meses",c=>{
                 const u=resumo(c.id).ultima;
                 return !!u && (Date.now()-new Date(u+"T12:00:00"))/864e5>180;}]];

function clientesFiltrados(){
  const q=S.busca.toLowerCase().trim();
  return Object.values(S.clientes)
    .filter(c=>!q||[c.nome,c.apelido,c.email,c.telefone_e164,c.empresa]
      .some(campo=>String(campo||"").toLowerCase().includes(q)))
    .filter(c=>FILTROS.every(([chave,,casa])=>!S.filtros.includes(chave)||casa(c)))
    .sort((a,b)=>resumo(b.id).bruto-resumo(a.id).bruto);
}
const filtrosHtml=()=>FILTROS.map(([chave,rotulo])=>
  `<button class="fbtn ${S.filtros.includes(chave)?"on":""}" onclick="toggleFiltro('${chave}')"
     aria-pressed="${S.filtros.includes(chave)}">${rotulo}</button>`).join("");
const listaHtml=()=>{
  const lista=clientesFiltrados();
  return lista.length?`<div class="rows">${lista.map(linhaCliente).join("")}</div>`
                     :`<div class="empty">Nenhum cliente encontrado.</div>`;
};

function vClientes(){
  return bannerDb()+`
    <div class="spread"><div><h1 class="t">Clientes</h1>
      <p class="lede">${Object.keys(S.clientes).length} na base</p></div>
      <button class="btn" onclick="formCliente()">+ Novo cliente</button></div>
    <div class="search"><input type="text" id="q" aria-label="Buscar cliente"
      placeholder="Nome, apelido, telefone, e-mail, empresa…"
      value="${esc(S.busca)}" oninput="buscar(this.value)"></div>
    <div class="filters" id="filtros">${filtrosHtml()}</div>
    <div id="lista">${listaHtml()}</div>`;
}

/* Só a lista é redesenhada: recriar o <input> a cada tecla tirava o foco e
   jogava o cursor para o fim da palavra no meio da digitação. */
function buscar(valor){
  S.busca=valor;
  $("#lista").innerHTML=listaHtml();
}
function linhaCliente(c){
  const s=resumo(c.id);
  return `<button class="rowitem" onclick="irCliente('${esc(c.id)}')">
    <span class="n">${esc(c.nome)}${temRisco(c)?' <span style="color:var(--urushi)">▲</span>':""}</span>
    <span class="m">${c.apelido?"“"+esc(c.apelido)+"” · ":""}${s.visitas} ${s.visitas===1?"visita":"visitas"}${s.ultima?" · última "+dcurto(s.ultima):""}</span>
    <span class="r"><b>${brl(s.bruto)}</b>${c.ranking?"top "+c.ranking:esc(c.status_cliente||"")}</span>
  </button>`;
}

/* Ficha */
function vFicha(id){
  const c=cliente(id);
  if(!c) return `<div class="empty">Cliente não encontrado.</div>`;
  const s=resumo(id), rs=resDe(id);
  const notas=Object.values(S.notas).filter(n=>n.cliente_id===id)
    .sort((a,b)=>String(b.criado_em).localeCompare(String(a.criado_em)));
  const T=(k,v,on,blank)=>`<div class="fld"><span class="k">${k}</span><span class="v">
    <button class="edit ${v?"":"blank"}" onclick="${on}">${v?esc(v):(blank||"registrar")}</button></span></div>`;
  const C=(k,arr,tipo,campo,cls)=>`<div class="fld"><span class="k">${k}</span><span class="v">
    <button class="edit ${arr&&arr.length?"":"blank"}" onclick="pickChips('${id}','${campo}','${tipo}')">${
      arr&&arr.length?`<span class="chips">${arr.map(x=>`<span class="chip ${cls||""}">${esc(x)}</span>`).join("")}</span>`:"registrar"}</button></span></div>`;
  const B=(k,v,campo)=>`<div class="fld"><span class="k">${k}</span><span class="v">
    <button class="edit ${v==null?"blank":""}" onclick="ciclaBool('${id}','${campo}')">${v==null?"registrar":(v?"Sim":"Não")}</button></span></div>`;
  const beb=c.bebidas||{}, cats=Object.keys(beb);
  const trunc=Object.entries(c.rotulos_truncados||{});
  return `<p style="margin:0 0 14px"><a href="#/clientes" style="font-family:var(--mono);font-size:11px;color:var(--ink-3);text-decoration:none">← Clientes</a></p>
  <div class="spread" style="margin-bottom:16px"><div>
    <h1 class="t">${esc(c.nome)}</h1>
    <p class="lede">${c.apelido?"“"+esc(c.apelido)+"” · ":""}${esc(c.status_cliente||"sem status")}${c.ranking?" · top "+c.ranking:""} · <span class="mono">${esc(c.codigo_legado||c.id)}</span></p>
  </div><button class="btn gh sm" onclick="formReserva('${esc(id)}')">+ Reserva</button></div>

  <div class="mets">
    <div class="met"><b class="num">${s.visitas}</b><span>Visitas</span></div>
    <div class="met"><b class="num">${s.pessoas}</b><span>Pessoas<br>atendidas</span></div>
    <div class="met"><b class="num">${brl(s.bruto)}</b><span>Bruto<br>acumulado</span></div>
    <div class="met"><b class="num">${brl(s.ticket)}</b><span>Ticket médio<br>por reserva</span></div>
  </div>

  <div class="blk crit"><h3>Segurança ${temRisco(c)?"":`<span style="letter-spacing:0;text-transform:none;font-family:var(--sans);font-size:11px">nada registrado</span>`}</h3>
    <div class="body"><div class="fields">
      ${C("Alergias",c.alergias,"alergia","alergias","risk")}
      ${C("Restrições",c.restricoes,"restricao","restricoes","risk")}
    </div></div></div>

  <div class="blk"><h3>Identidade</h3><div class="body"><div class="fields">
    ${T("Nome",c.nome,`editaTexto('${id}','nome','Nome')`)}
    ${T("Como chamar",c.apelido,`editaTexto('${id}','apelido','Como chamar')`)}
    ${T("Status",c.status_cliente,`pickUm('${id}','status_cliente','status_cliente')`)}
    ${T("Telefone",c.telefone_e164,`editaTexto('${id}','telefone_e164','Telefone (E.164)')`)}
    ${T("E-mail",c.email,`editaTexto('${id}','email','E-mail')`)}
    ${T("Aniversário",c.aniversario?dfmt(c.aniversario):"",`editaData('${id}','aniversario','Aniversário')`)}
  </div></div></div>

  <div class="blk"><h3>À mesa</h3><div class="body"><div class="fields">
    ${T("Mão dominante",c.mao_dominante,`pickUm('${id}','mao_dominante','mao_dominante')`)}
    ${B("Hashi próprio",c.hashi_personalizado,"hashi_personalizado")}
    ${T("Água",c.preferencia_agua,`pickUm('${id}','preferencia_agua','preferencia_agua')`)}
    ${T("Marca de água",c.marca_agua,`pickUm('${id}','marca_agua','marca_agua')`)}
    ${C("Preferências",c.preferencias,"preferencia","preferencias")}
  </div></div></div>

  <div class="blk"><h3>Adega ${c.traz_proprias_bebidas?`<span class="pill go" style="border:0">traz as próprias</span>`:""}</h3>
    <div class="body">
    ${cats.length?cats.map(k=>`<div class="fld"><span class="k">${esc(k)}</span><span class="v"><div class="chips">${
      beb[k].map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></span></div>`).join(""):
      `<p class="muted" style="margin:0;font-size:.9rem">Nada registrado ainda.</p>`}
    ${trunc.length?`<div class="banner warn" style="margin:13px 0 0"><span>▲</span><span><b>Rótulos perdidos na planilha:</b> ${
      trunc.map(([k,n])=>n+" de "+k).join(", ")}. Vieram truncados como “(+n rótulos)” e precisam ser recuperados no arquivo original.</span></div>`:""}
    </div></div>

  <div class="blk"><h3>História · ${rs.length} ${rs.length===1?"visita":"visitas"}</h3><div class="body">
    ${rs.length?`<div class="tl">${rs.map(r=>`<div class="ev">
      <span class="d">${esc(dcurto(r.data_reserva))}</span>
      <span class="w"><b>${esc(r.experiencia||"Experiência não registrada")}</b>
        <small>${r.total_pessoas||"?"} ${r.total_pessoas===1?"pessoa":"pessoas"} · ${esc(r.tipo_mesa||"—")} · ${esc(r.horario||"--:--")}${
        r.primeira_visita?" · primeira visita":""}${r.feedback?" · “"+esc(r.feedback)+"”":""}</small></span>
      <span class="amt">${brl(r.total_bruto)}${r.consumo_bebida?`<br><span class="muted">bebida ${brl(r.consumo_bebida)}</span>`:""}

    </div>`).join("")}</div>`:`<p class="muted" style="margin:0;font-size:.9rem">Nenhuma reserva ainda.</p>`}
  </div></div>

  <div class="blk"><h3>Relacionamento</h3><div class="body"><div class="fields">
    ${C("Cargo",c.cargo,"cargo","cargo")}
    ${T("Empresa",c.empresa,`editaTexto('${id}','empresa','Empresa')`)}
    ${C("Profissão",c.profissao,"profissao","profissao")}
    ${C("Perfil",c.perfil_interesses,"perfil_interesses","perfil_interesses")}
    ${C("Interesses",c.interesses_gastronomicos,"interesse_gastronomico","interesses_gastronomicos")}
    ${B("Já foi ao Japão",c.ja_foi_ao_japao,"ja_foi_ao_japao")}
    ${B("Costuma viajar",c.habito_viajar,"habito_viajar")}
    ${B("Casado(a)",c.casado,"casado")}
    ${T("Cônjuge",c.conjuge,`editaTexto('${id}','conjuge','Cônjuge / companheiro(a)')`)}
    ${T("Endereço",[c.endereco,c.bairro,c.cep].filter(Boolean).join(" · "),`editaTexto('${id}','endereco','Endereço')`)}
  </div></div></div>

  <div class="blk"><h3>Anotações <button class="btn gh sm" onclick="novaNota('${esc(id)}')">+ anotar</button></h3>
    <div class="body">${notas.length?notas.map(n=>`<div class="note"><p>${esc(n.texto)}</p>
      <span class="meta">${esc(dfmt((n.criado_em||"").slice(0,10)))}${n.autor?" · "+esc(n.autor):""}</span></div>`).join(""):
      `<p class="muted" style="margin:0;font-size:.9rem">Nenhuma anotação. É aqui que vai o que a equipe percebe na mesa.</p>`}
    </div></div>
  <p style="margin:22px 0 0"><button class="btn dang sm" onclick="removeCliente('${esc(id)}')">Excluir cliente</button></p>`;
}

/* Painel — a home */
function anosBrutos(){
  const por={};
  Object.values(S.reservas).forEach(r=>{
    if(!r.data_reserva) return;
    const a=r.data_reserva.slice(0,4);
    por[a]=(por[a]||0)+(r.total_bruto||0);
  });
  return Object.keys(por).sort().map(a=>({ano:a,valor:por[a]}));
}
function vPainel(){
  const cs=Object.values(S.clientes), rs=Object.values(S.reservas);
  const bruto=rs.reduce((s,r)=>s+(r.total_bruto||0),0);
  const beb=rs.reduce((s,r)=>s+(r.consumo_bebida||0),0);
  const pax=rs.reduce((s,r)=>s+(r.total_pessoas||0),0);
  const h=hoje();
  const dhoje=rs.filter(r=>r.data_reserva===h).sort((a,b)=>String(a.horario).localeCompare(String(b.horario)));
  const prox=rs.filter(r=>r.data_reserva>h).sort((a,b)=>String(a.data_reserva).localeCompare(String(b.data_reserva))).slice(0,3);
  const aFaturar=rs.filter(r=>r.status_financeiro==="Aguardando faturamento");
  const semFicha=cs.filter(c=>!(c.alergias||[]).length&&!(c.restricoes||[]).length);
  const sumidos=cs.filter(c=>{const u=resumo(c.id).ultima;return u&&(Date.now()-new Date(u+"T12:00:00"))/864e5>180;});
  const risco=cs.filter(temRisco);
  const aniv=cs.filter(c=>c.aniversario&&c.aniversario.slice(5,7)===h.slice(5,7));

  const st=(mk,cor,lb,ct,acao)=>`<div class="statusrow"><span class="mk" style="color:${cor}" aria-hidden="true">${mk}</span>
    <span class="lb">${lb}</span><span class="ct" style="color:${cor}">${ct}</span>
    ${acao?`<button class="btn gh sm" onclick="${acao}">ver</button>`:""}</div>`;

  const anos=anosBrutos(), max=Math.max.apply(null,anos.map(a=>a.valor).concat([1]));

  return bannerDb()+`
  <div class="spread" style="margin-bottom:18px"><div>
    <h1 class="t">Painel</h1>
    <p class="lede">${dfmt(h)} · ${diaSem(h)}</p></div>
    <div class="row"><button class="btn gh" onclick="formCliente()">+ Cliente</button>
    <button class="btn" onclick="formReserva()">+ Reserva</button></div></div>

  <div class="mets">
    <div class="met"><b class="num">${cs.length}</b><span>Clientes</span></div>
    <div class="met"><b class="num">${rs.length}</b><span>Reservas</span></div>
    <div class="met"><b class="num">${brl(bruto)}</b><span>Bruto acumulado</span></div>
    <div class="met"><b class="num">${bruto?Math.round(beb/bruto*100):0}%</b><span>Do bruto é bebida</span></div>
  </div>

  <div class="blk"><h3>Serviço de hoje</h3><div class="body">
    ${dhoje.length?dhoje.map(cardRes).join(""):
      (prox.length?`<p class="muted" style="margin:0 0 12px;font-size:.9rem">Nada hoje. As próximas:</p>`+prox.map(cardRes).join(""):
       `<div class="row" style="gap:12px"><span class="muted" style="font-size:.9rem">Nenhuma reserva para hoje nem à frente.</span>
        <button class="btn sm" onclick="formReserva()">+ Criar reserva</button></div>`)}
  </div></div>

  <div class="blk"><h3>Precisa de atenção</h3><div class="body">
    ${st("▲","var(--amber)","Reservas aguardando faturamento",aFaturar.length,"location.hash='#/agenda'")}
    ${st("▲","var(--amber)","Fichas sem alergia nem restrição registrada",semFicha.length+" de "+cs.length,"")}
    ${st("▲","var(--amber)","Clientes sem vir há mais de 6 meses",sumidos.length,"filtrarPor('sumido')")}
    ${st("●","var(--urushi)","Clientes com alergia ou restrição",risco.length,"filtrarPor('risco')")}
    ${st("●","var(--matcha)","Aniversariantes deste mês",aniv.length,"")}
    ${st("●","var(--ink-3)","Pessoas atendidas no total",pax,"")}
  </div></div>

  ${anos.length?`<div class="blk"><h3>Faturamento bruto por ano</h3><div class="body">
    <div class="bars">${anos.map(a=>`<div class="barrow">
      <span class="yl">${a.ano}</span>
      <span class="tr"><span class="fl" style="width:${Math.max(1,a.valor/max*100)}%"></span></span>
      <span class="vl">${brl(a.valor)}</span></div>`).join("")}</div>
    <p class="muted" style="margin:12px 0 0;font-size:.8rem">Somado das ${rs.length} reservas que estão no app.</p>
  </div></div>`:""}

  <div class="banner info"><span>▲</span><span>Da planilha veio a ficha completa de <b>um</b> cliente — as outras 2.081 estão no arquivo do SharePoint, que este app não alcança. Os números acima são os do que está aqui dentro, não os da base inteira.</span></div>`;
}
function filtrarPor(chave){S.filtros=[chave];S.busca="";location.hash="#/clientes"}

/* Listas */
function vListas(){
  const ts=Object.values(S.tax).sort((a,b)=>String(a.label).localeCompare(String(b.label)));
  return bannerDb()+`<h1 class="t">Listas</h1>
  <p class="lede">As opções que aparecem nos campos da ficha. Editar aqui muda o app inteiro — sem mexer em código.</p>
  ${ts.length?ts.map(t=>{const at=(t.opcoes||[]).filter(o=>o.ativo).length;
    return `<div class="blk"><h3>${esc(t.label)} · ${at} ativas
      <button class="btn gh sm" onclick="addOpcao('${esc(t.tipo)}')">+ opção</button></h3>
      <div class="body" style="padding:0"><div class="rows" style="border:0;border-radius:0">
      ${(t.opcoes||[]).map((o,i)=>`<button class="taxrow ${o.ativo?"":"off"}" onclick="toggleOpcao('${esc(t.tipo)}',${i})">
        <span style="flex:1">${esc(o.valor)}</span>
        <span class="off" style="font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)">${o.ativo?"ativa":"inativa"}</span>
      </button>`).join("")}</div></div></div>`}).join(""):`<div class="empty">Nenhuma lista carregada.</div>`}
  <div class="banner info"><span>▲</span><span>Uma opção retirada fica <b>inativa</b>, nunca apagada — senão a ficha de quem foi marcado com ela perderia o sentido.</span></div>`;
}

/* ── ações ────────────────────────────────────────── */
function irCliente(id){location.hash="#/cliente/"+id}
function toggleFiltro(chave){
  S.filtros=S.filtros.includes(chave)?S.filtros.filter(x=>x!==chave):S.filtros.concat([chave]);
  $("#filtros").innerHTML=filtrosHtml();
  $("#lista").innerHTML=listaHtml();
}
function ciclaBool(id,campo){const c=cliente(id);const v=c[campo];
  grava("clientes",id,{[campo]:v==null?true:(v?false:null),atualizado_em:hoje()},true)}
function alerta(m){modal(`<header><h4>Ops</h4><button class="x" onclick="fecha()">×</button></header>
  <div class="sbody"><p style="margin:0">${esc(m)}</p></div>
  <footer><button class="btn" onclick="fecha()">Entendi</button></footer>`)}

/* modal infra */
function modal(html){$("#modal").innerHTML=`<div class="scrim" onclick="if(event.target===this)fecha()"><div class="sheet">${html}</div></div>`;
  const f=$("#modal input,#modal textarea"); if(f) setTimeout(()=>f.focus(),40)}
function fecha(){$("#modal").innerHTML=""}

function editaTexto(id,campo,label){const c=cliente(id);
  modal(`<header><h4>${esc(label)}</h4><button class="x" onclick="fecha()">×</button></header>
  <div class="sbody"><input type="text" id="mi" value="${esc(c[campo]||"")}"
    onkeydown="if(event.key==='Enter')salvaTexto('${id}','${campo}')"></div>
  <footer><button class="btn gh" onclick="fecha()">Cancelar</button>
  <button class="btn" onclick="salvaTexto('${id}','${campo}')">Salvar</button></footer>`)}
function salvaTexto(id,campo){const v=$("#mi").value.trim();
  grava("clientes",id,{[campo]:v||null,atualizado_em:hoje()},true);fecha()}
function editaData(id,campo,label){const c=cliente(id);
  modal(`<header><h4>${esc(label)}</h4><button class="x" onclick="fecha()">×</button></header>
  <div class="sbody"><input type="date" id="mi" value="${esc(c[campo]||"")}"></div>
  <footer><button class="btn gh" onclick="fecha()">Cancelar</button>
  <button class="btn" onclick="salvaTexto('${id}','${campo}')">Salvar</button></footer>`)}

let PICK={};
function pickChips(id,campo,tipo){
  PICK={id:id,campo:campo,tipo:tipo,sel:(cliente(id)[campo]||[]).slice(),busca:"",multi:true};pintaPick()}
function pickUm(id,campo,tipo){
  const v=cliente(id)[campo];
  PICK={id:id,campo:campo,tipo:tipo,sel:v?[v]:[],busca:"",multi:false};pintaPick()}
function pintaPick(){
  const t=S.tax[PICK.tipo]||{},q=PICK.busca.toLowerCase();
  const lista=(t.opcoes||[]).filter(o=>o.ativo&&o.valor.toLowerCase().includes(q));
  modal(`<header><h4>${esc(t.label||PICK.campo)}</h4><button class="x" onclick="fecha()">×</button></header>
  <div class="sbody">
    <input type="text" id="mi" placeholder="Buscar entre ${(t.opcoes||[]).length} opções…" value="${esc(PICK.busca)}"
      oninput="PICK.busca=this.value;pintaPick()">
    ${PICK.multi?`<p class="muted" style="font-size:.82rem;margin:9px 0 0">${PICK.sel.length} selecionada${PICK.sel.length===1?"":"s"}</p>`:""}
    <div class="opts" style="margin-top:11px" onclick="aoClicarOpcao(event)">${lista.length?lista.map(o=>
      `<button class="opt ${PICK.sel.includes(o.valor)?"on":""}" data-valor="${esc(o.valor)}">
        <span class="bx">✓</span><span>${esc(o.valor)}</span></button>`).join(""):
      `<div style="background:var(--paper);padding:16px;text-align:center;color:var(--ink-3);font-size:.88rem">
        Nada com “${esc(PICK.busca)}”. <button class="btn gh sm" style="margin-left:6px" onclick="criaOpcao()">Criar opção</button></div>`}
    </div></div>
  <footer><button class="btn gh" onclick="fecha()">Cancelar</button>
  <button class="btn" onclick="pickSalva()">Salvar</button></footer>`)}
/* O valor vem do data-attribute, e não interpolado no onclick: uma opção com
   aspas ou apóstrofo quebrava o handler inteiro. */
function aoClicarOpcao(evento){
  const botao=evento.target.closest("[data-valor]");
  if(botao) pickToggle(botao.dataset.valor);
}
function aoClicarOcasiao(evento){
  const botao=evento.target.closest("[data-valor]");
  if(botao) posOc(botao.dataset.valor);
}
function pickToggle(v){
  if(!PICK.multi){PICK.sel=[v];pickSalva();return}
  PICK.sel=PICK.sel.includes(v)?PICK.sel.filter(x=>x!==v):PICK.sel.concat([v]);pintaPick()}
function pickSalva(){
  const v=PICK.multi?PICK.sel:(PICK.sel[0]||null);
  grava("clientes",PICK.id,{[PICK.campo]:v,atualizado_em:hoje()},true);fecha()}
async function criaOpcao(){
  const novo=PICK.busca.trim(); if(!novo) return;
  const t=S.tax[PICK.tipo]||{tipo:PICK.tipo,label:PICK.tipo,opcoes:[]};
  const ops=(t.opcoes||[]).concat([{valor:novo,ativo:true}]);
  await grava("taxonomias",PICK.tipo,{tipo:PICK.tipo,label:t.label||PICK.tipo,opcoes:ops},true);
  PICK.sel=PICK.multi?PICK.sel.concat([novo]):[novo]; PICK.busca=""; pintaPick()}

function addOpcao(tipo){const t=S.tax[tipo]||{};
  modal(`<header><h4>Nova opção · ${esc(t.label||tipo)}</h4><button class="x" onclick="fecha()">×</button></header>
  <div class="sbody"><input type="text" id="mi" placeholder="Ex.: Ostra defumada"></div>
  <footer><button class="btn gh" onclick="fecha()">Cancelar</button>
  <button class="btn" onclick="salvaOpcao('${esc(tipo)}')">Adicionar</button></footer>`)}
function salvaOpcao(tipo){const v=$("#mi").value.trim(); if(!v){fecha();return}
  const t=S.tax[tipo]||{tipo:tipo,label:tipo,opcoes:[]};
  grava("taxonomias",tipo,{tipo:tipo,label:t.label||tipo,opcoes:(t.opcoes||[]).concat([{valor:v,ativo:true}])},true);fecha()}
function toggleOpcao(tipo,i){const t=S.tax[tipo]; if(!t)return;
  const ops=t.opcoes.map((o,j)=>j===i?{valor:o.valor,ativo:!o.ativo}:o);
  grava("taxonomias",tipo,{tipo:tipo,label:t.label,opcoes:ops},true)}

function formCliente(){
  modal(`<header><h4>Novo cliente</h4><button class="x" onclick="fecha()">×</button></header>
  <div class="sbody">
    <p class="muted" style="margin:0 0 14px;font-size:.85rem">Seis campos. Todo o resto se preenche depois, na ficha, quando a informação aparecer.</p>
    <label class="f"><span>Nome *</span><input type="text" id="c_nome"></label>
    <div class="grid2">
      <label class="f"><span>Como chamar</span><input type="text" id="c_apelido"></label>
      <label class="f"><span>Status</span><select id="c_status">${
        ["",...ops("status_cliente")].map(o=>`<option${o==="Titular"?" selected":""}>${esc(o)}</option>`).join("")}</select></label>
      <label class="f"><span>Telefone</span><input type="text" id="c_tel" placeholder="+55 11 90000-0000"></label>
      <label class="f"><span>E-mail</span><input type="email" id="c_email"></label>
    </div>
    <label class="f"><span>Empresa</span><input type="text" id="c_emp"></label>
  </div>
  <footer><button class="btn gh" onclick="fecha()">Cancelar</button>
  <button class="btn" onclick="salvaCliente()">Criar cliente</button></footer>`)}
function e164(t){const d=String(t||"").replace(/\D/g,""); if(!d)return null;
  return "+"+(d.length<=11?"55"+d:d)}
async function salvaCliente(){
  const nome=$("#c_nome").value.trim(); if(!nome){alerta("O nome é obrigatório.");return}
  const id=novoId("CLI");
  await grava("clientes",id,{codigo_legado:id,nome:nome,apelido:$("#c_apelido").value.trim()||null,
    status_cliente:$("#c_status").value||null,telefone_e164:e164($("#c_tel").value),
    email:$("#c_email").value.trim()||null,empresa:$("#c_emp").value.trim()||null,
    alergias:[],restricoes:[],preferencias:[],perfil_interesses:[],interesses_gastronomicos:[],
    profissao:[],cargo:[],bebidas:{},criado_em:hoje(),atualizado_em:hoje()});
  fecha(); irCliente(id)}

function formReserva(clienteId){
  const cs=Object.values(S.clientes).sort((a,b)=>a.nome.localeCompare(b.nome));
  if(!cs.length){alerta("Cadastre um cliente antes de criar a reserva.");return}
  modal(`<header><h4>Nova reserva</h4><button class="x" onclick="fecha()">×</button></header>
  <div class="sbody">
    <label class="f"><span>Cliente *</span><select id="r_cli">${cs.map(c=>
      `<option value="${esc(c.id)}"${c.id===clienteId?" selected":""}>${esc(c.nome)}</option>`).join("")}</select></label>
    <div class="grid2">
      <label class="f"><span>Data</span><input type="date" id="r_data" value="${hoje()}"></label>
      <label class="f"><span>Horário</span><input type="time" id="r_hora" value="19:00"></label>
      <label class="f"><span>Pessoas</span><input type="number" id="r_pax" value="2" min="1"></label>
      <label class="f"><span>Mesa</span><input type="text" id="r_mesa" value="Balcão"></label>
    </div>
    <label class="f"><span>Experiência</span><input type="text" id="r_exp" placeholder="Seasonal Omakase"></label>
  </div>
  <footer><button class="btn gh" onclick="fecha()">Cancelar</button>
  <button class="btn" onclick="salvaReserva()">Criar reserva</button></footer>`)}
async function salvaReserva(){
  const cid=$("#r_cli").value, id=novoId("RSV");
  const jaVeio=resDe(cid).length>0;
  await grava("reservas",id,{cliente_id:cid,data_reserva:$("#r_data").value,horario:$("#r_hora").value,
    total_pessoas:parseInt($("#r_pax").value,10)||null,tipo_mesa:$("#r_mesa").value.trim()||null,
    experiencia:$("#r_exp").value.trim()||null,ocasioes:[],acompanhantes:[],
    status_reserva:"Confirmada",primeira_visita:!jaVeio,origem:"App",
    status_financeiro:"Aguardando faturamento",criado_em:hoje()});
  fecha(); location.hash="#/agenda"}

/* pós-serviço */
let POS={};
function posServico(rid){const r=S.reservas[rid]; if(!r)return;
  POS={rid:rid,exp:r.experiencia||"",nota:r.feedback||"",oc:(r.ocasioes||[]).slice(),
       bruto:r.total_bruto||"",beb:r.consumo_bebida||"",humor:r.humor||null};pintaPos()}
function pintaPos(){const r=S.reservas[POS.rid], c=cliente(r.cliente_id);
  const CARAS=[["1","muito ruim"],["2","ruim"],["3","ok"],["4","boa"],["5","excelente"]];
  modal(`<header><h4>Depois do serviço</h4><button class="x" onclick="fecha()">×</button></header>
  <div class="sbody">
    <p class="muted" style="margin:0 0 15px;font-size:.85rem">${esc(c?c.nome:"")} · ${esc(dfmt(r.data_reserva))} · trinta segundos, nada obrigatório.</p>
    <label class="f"><span>O que foi servido</span><input type="text" id="p_exp" value="${esc(POS.exp)}"></label>
    <p style="font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 6px">Como foi</p>
    <div class="row" style="margin-bottom:15px">${CARAS.map(([n,l])=>
      `<button class="fbtn ${POS.humor===n?"on":""}" onclick="POS.humor='${n}';POS.exp=document.getElementById('p_exp').value;POS.nota=document.getElementById('p_nota').value;pintaPos()">${n} · ${l}</button>`).join("")}</div>
    <p style="font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 6px">Ocasião</p>
    <div class="row" style="margin-bottom:15px" onclick="aoClicarOcasiao(event)">${ops("ocasiao").map(o=>
      `<button class="fbtn ${POS.oc.includes(o)?"on":""}" data-valor="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div class="grid2">
      <label class="f"><span>Consumo de bebida (R$)</span><input type="number" id="p_beb" value="${esc(POS.beb)}"></label>
      <label class="f"><span>Total bruto (R$)</span><input type="number" id="p_bruto" value="${esc(POS.bruto)}"></label>
    </div>
    <label class="f"><span>Algo para lembrar</span><textarea id="p_nota" placeholder="Elogiou o unagi. Perguntou por sake de Niigata.">${esc(POS.nota)}</textarea></label>
  </div>
  <footer><button class="btn gh" onclick="fecha()">Cancelar</button>
  <button class="btn" onclick="salvaPos()">Salvar</button></footer>`)}
function posOc(o){POS.exp=$("#p_exp").value;POS.nota=$("#p_nota").value;
  POS.oc=POS.oc.includes(o)?POS.oc.filter(x=>x!==o):POS.oc.concat([o]);pintaPos()}
async function salvaPos(){
  const r=S.reservas[POS.rid];
  const nota=$("#p_nota").value.trim();
  const beb=parseFloat($("#p_beb").value), bruto=parseFloat($("#p_bruto").value);
  await grava("reservas",POS.rid,{experiencia:$("#p_exp").value.trim()||null,ocasioes:POS.oc,
    humor:POS.humor,consumo_bebida:isNaN(beb)?null:beb,total_bruto:isNaN(bruto)?null:bruto,
    status_financeiro:isNaN(bruto)?"Aguardando faturamento":"Faturado"},true);
  if(nota&&nota!==(r.feedback||"")) await addNota(r.cliente_id,nota);
  fecha()}

function novaNota(id){
  modal(`<header><h4>Anotação</h4><button class="x" onclick="fecha()">×</button></header>
  <div class="sbody"><textarea id="mi" placeholder="O que a equipe percebeu na mesa."></textarea></div>
  <footer><button class="btn gh" onclick="fecha()">Cancelar</button>
  <button class="btn" onclick="salvaNota('${esc(id)}')">Salvar</button></footer>`)}
async function salvaNota(id){const t=$("#mi").value.trim(); if(t) await addNota(id,t); fecha()}
async function addNota(clienteId,texto){
  const id="N"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  await grava("notas",id,{cliente_id:clienteId,texto:texto,criado_em:new Date().toISOString()})}

function removeCliente(id){
  modal(`<header><h4>Excluir cliente</h4><button class="x" onclick="fecha()">×</button></header>
  <div class="sbody"><p style="margin:0">Isso apaga a ficha de <b>${esc((cliente(id)||{}).nome)}</b>. As reservas continuam no banco.</p></div>
  <footer><button class="btn gh" onclick="fecha()">Cancelar</button>
  <button class="btn dang" onclick="confirmaRemove('${esc(id)}')">Excluir</button></footer>`)}
async function confirmaRemove(id){await apaga("clientes",id);fecha();location.hash="#/clientes"}

/* ── boot ─────────────────────────────────────────── */
window.addEventListener("hashchange",()=>{S.rota=location.hash.slice(2)||"painel";fecha();const m=document.querySelector("main");if(m)m.scrollTop=0;pinta()});
pinta();
conectar();
</script>
